project:
  name: ehms_uniform_label_flip_client4
  seed: 42
dataset:
  path: data/raw/ehms/wustl-ehms-2020_with_attacks_categories.csv
  label_column: Label
  positive_label: 1
  drop_columns:
  - Dir
  - Flgs
  - SrcAddr
  - DstAddr
  - Sport
  - Dport
  - SrcGap
  - DstGap
  - SrcMac
  - DstMac
  - DIntPktAct
  - dMinPktSz
  - Trans
  - Attack Category
  max_rows: null
split:
  method: fingerprint_disjoint
  test_size: 0.2
  validation_size: 0.2
  group_column: null
  time_column: null
preprocessing:
  use_ica: false
  ica_components: null
federated:
  n_clients: 5
  partition:
    method: dirichlet_label
    alpha: 0.3
    min_samples_per_client: 200
    require_all_classes: true
  aggregation:
    method: uniform
    sample_power: 0.0
    performance_power: 3.0
    time_power: 0.0
    calibration_strength: 2.0
    consensus_strength: 0.25
    max_weight: 0.4
poisoning:
  enabled: true
  attack: label_flip
  malicious_clients:
  - 4
  flip_fraction: 1.0
model:
  backend: xgboost
  class_weight: balanced
  params:
    n_estimators: 800
    learning_rate: 0.03
    max_depth: 7
    min_child_weight: 2
    subsample: 0.8
    colsample_bytree: 0.85
    reg_alpha: 0.05
    reg_lambda: 1.5
    gamma: 0.0
    tree_method: hist
    early_stopping_rounds: 60
    n_jobs: -1
evaluation:
  bootstrap_repetitions: 500
output:
  directory: outputs/ehms_uniform_label_flip_client4
