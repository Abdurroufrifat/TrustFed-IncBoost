project:
  name: synthetic_trustfed_label_flip
  seed: 42
dataset:
  path: data/raw/synthetic/synthetic_iot.csv
  label_column: label
  positive_label: attack
  drop_columns: [timestamp, device_id]
  max_rows: null
split:
  method: fingerprint_disjoint
  test_size: 0.20
  validation_size: 0.20
  group_column: null
  time_column: null
preprocessing:
  use_ica: false
  ica_components: null
federated:
  n_clients: 4
  partition:
    method: dirichlet_label
    alpha: 0.50
    min_samples_per_client: 50
    require_all_classes: true
  aggregation:
    method: trust_aware
    sample_power: 0.00
    performance_power: 3.00
    time_power: 0.00
    calibration_strength: 2.00
    consensus_strength: 0.25
    max_weight: 0.45
poisoning:
  enabled: true
  attack: label_flip
  malicious_clients: [0]
  flip_fraction: 1.00
model:
  backend: sklearn
  class_weight: balanced
  params:
    learning_rate: 0.08
    max_iter: 120
    max_leaf_nodes: 31
    l2_regularization: 1.0
evaluation:
  bootstrap_repetitions: 50
output:
  directory: outputs/synthetic_trustfed_label_flip
