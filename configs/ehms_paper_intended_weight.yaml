project:
  name: ehms_paper_intended_weight
  seed: 42
dataset:
  path: data/raw/ehms/wustl-ehms-2020_with_attacks_categories.csv
  label_column: Label
  positive_label: 1
  drop_columns:
    - Dir
    - Flgs
    - SrcAddr
    - DstAddr
    - Sport
    - Dport
    - SrcGap
    - DstGap
    - SrcMac
    - DstMac
    - DIntPktAct
    - dMinPktSz
    - Trans
    - "Attack Category"
  max_rows: null
split:
  method: random_stratified
  test_size: 0.20
  validation_size: 0.00
  group_column: null
  time_column: null
preprocessing:
  use_ica: true
  ica_components: auto
model:
  backend: xgboost
  class_weight: balanced
  threshold_metric: fixed_0.5
  params:
    n_estimators: 300
    learning_rate: 1.0
    max_depth: 10
    max_delta_step: 0
    subsample: 0.50
    colsample_bytree: 1.0
    reg_alpha: 0.0
    reg_lambda: 1.0
    gamma: 0.0
    tree_method: hist
    n_jobs: -1
assumptions:
  n_estimators: "Not specified in the paper; initial sensitivity value."
  ica_components: "Not specified; automatic value must be recorded."
  regularization: "Lambda and gamma values are not reported."
evaluation:
  bootstrap_repetitions: 500
output:
  directory: outputs/ehms_paper_intended_weight
